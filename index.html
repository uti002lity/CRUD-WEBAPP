<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetFlow - Web App Secure CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 w-full backdrop-blur border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <span class="font-bold text-xl tracking-tight">Sheet<span class="text-brand-500">Flow</span> <span class="text-xs px-2 py-0.5 rounded bg-brand-500/10 text-brand-500 border border-brand-500/20 font-mono">SECURE</span></span>
            </div>

            <div class="flex items-center space-x-3">
                <div id="userInfo" class="hidden items-center space-x-3">
                    <span id="userDisplayName" class="text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300"></span>
                    <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-600/10 hover:bg-rose-600/20 text-rose-500 rounded-lg text-xs font-semibold transition-colors">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i>Logout
                    </button>
                </div>
                <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i id="themeIcon" class="fa-solid fa-sun text-amber-500"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Content -->
    <main id="appContent" class="flex-grow hidden">
        <section id="demo" class="py-8 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
                <div>
                    <h2 class="text-2xl sm:text-3xl font-bold">Aplikasi CRUD Spreadsheet</h2>
                    <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Data terenkripsi dan terverifikasi API Key.</p>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="fetchData()" class="p-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 rounded-lg text-sm">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button onclick="openAddModal()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-lg shadow flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i><span>Tambah Data</span>
                    </button>
                </div>
            </div>

            <!-- Table Controls -->
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 mb-6 flex flex-col sm:flex-row gap-4 justify-between items-center shadow-sm">
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderTable()" placeholder="Cari nama atau email..." class="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm">
                </div>
                <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                    <select id="statusFilter" onchange="renderTable()" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm py-2 px-3">
                        <option value="ALL">Semua Status</option>
                        <option value="Aktif">Aktif</option>
                        <option value="Pending">Pending</option>
                        <option value="Nonaktif">Nonaktif</option>
                    </select>
                </div>
            </div>

            <!-- Table Area -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden relative">
                <div id="loadingOverlay" class="absolute inset-0 bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center">
                    <i class="fa-solid fa-spinner animate-spin text-3xl text-brand-600 mb-2"></i>
                    <span class="text-sm font-medium">Memuat Data Secara Aman...</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 dark:bg-slate-900/50 text-slate-500 uppercase text-[11px]">
                            <tr>
                                <th class="py-3.5 px-4">ID</th>
                                <th class="py-3.5 px-4">Nama Lengkap</th>
                                <th class="py-3.5 px-4">Email</th>
                                <th class="py-3.5 px-4">Peran</th>
                                <th class="py-3.5 px-4">Status</th>
                                <th class="py-3.5 px-4 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-200 dark:divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Login -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-800 max-w-md w-full rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-brand-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold">Login Terproteksi</h2>
                <p class="text-slate-500 text-xs mt-1">Sistem memerlukan autentikasi API Key terenkripsi.</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email</label>
                    <input type="email" id="loginEmail" required placeholder="nama@email.com" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm">
                </div>
                <button type="submit" id="loginBtn" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg text-sm transition-all shadow-lg shadow-brand-600/30">
                    <span>Masuk Aplikasi</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Form CRUD -->
    <div id="dataModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full border border-slate-200 dark:border-slate-700 shadow-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg">Tambah Data</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="dataForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nama Lengkap</label>
                    <input type="text" id="inputName" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email</label>
                    <input type="email" id="inputEmail" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Peran</label>
                        <select id="inputRole" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm">
                            <option value="Admin">Admin</option>
                            <option value="Editor">Editor</option>
                            <option value="Viewer">Viewer</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Status</label>
                        <select id="inputStatus" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm">
                            <option value="Aktif">Aktif</option>
                            <option value="Pending">Pending</option>
                            <option value="Nonaktif">Nonaktif</option>
                        </select>
                    </div>
                </div>
                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm">Batal</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-semibold">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg hidden items-center space-x-3 z-50 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage"></span>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8ekJkWZlBW0YDIjWbagXdz-CzQoK7YaFXREtuuU1qAkRHGjWeH8JgvTzEUkeGNnc/exec';
        
        // SECRET API KEY (Harus sama persis dengan di Google Apps Script)
        const SECRET_API_KEY = 'SheetFlow_SuperSecret_Key_2026';

        let sheetData = [];

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('sheetflow_user'));
            if (user && user.token) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('flex');
                document.getElementById('userDisplayName').innerText = user.name;
                fetchData();
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
                document.getElementById('appContent').classList.add('hidden');
                document.getElementById('userInfo').classList.add('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerText = 'Memverifikasi Kunci...';
            loginBtn.disabled = true;

            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        apiKey: SECRET_API_KEY, 
                        action: 'login', 
                        email: email, 
                        password: password 
                    })
                });
                const result = await res.json();

                if (result.status === 'success') {
                    localStorage.setItem('sheetflow_user', JSON.stringify(result.user));
                    showToast('Otentikasi Berhasil!');
                    checkAuth();
                } else {
                    showToast(result.message, true);
                }
            } catch (err) {
                showToast('Akses ditolak atau koneksi gagal', true);
            } finally {
                loginBtn.innerText = 'Masuk Aplikasi';
                loginBtn.disabled = false;
            }
        }

        function handleLogout() {
            localStorage.removeItem('sheetflow_user');
            showToast('Anda telah keluar');
            checkAuth();
        }

        async function fetchData() {
            showLoading(true);
            try {
                // Mengirimkan API Key melalui parameter GET URL
                const response = await fetch(`${APPS_SCRIPT_URL}?apiKey=${encodeURIComponent(SECRET_API_KEY)}`);
                const result = await response.json();
                
                if (result.status === 'error') {
                    showToast(result.message, true);
                    return;
                }
                
                sheetData = result;
                renderTable();
            } catch (error) {
                showToast("Gagal mengambil data terproteksi", true);
            } finally {
                showLoading(false);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const statusVal = document.getElementById('statusFilter').value;
            tbody.innerHTML = '';

            const filtered = sheetData.filter(item => {
                const name = item.name ? item.name.toString().toLowerCase() : '';
                const email = item.email ? item.email.toString().toLowerCase() : '';
                return (name.includes(searchVal) || email.includes(searchVal)) && (statusVal === 'ALL' || item.status === statusVal);
            });

            filtered.forEach(item => {
                let badgeClass = item.status === 'Aktif' ? 'bg-emerald-100 text-emerald-700' : (item.status === 'Pending' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-mono text-xs">${item.id || '-'}</td>
                    <td class="py-3.5 px-4 font-semibold">${item.name || ''}</td>
                    <td class="py-3.5 px-4">${item.email || ''}</td>
                    <td class="py-3.5 px-4">${item.role || ''}</td>
                    <td class="py-3.5 px-4"><span class="px-2.5 py-1 rounded-full text-[11px] font-semibold ${badgeClass}">${item.status || ''}</span></td>
                    <td class="py-3.5 px-4 text-right space-x-2">
                        <button onclick="openEditModal('${item.id}')" class="text-blue-500"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteData('${item.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const payload = {
                apiKey: SECRET_API_KEY,
                action: document.getElementById('editId').value ? "update" : "create",
                id: document.getElementById('editId').value,
                name: document.getElementById('inputName').value,
                email: document.getElementById('inputEmail').value,
                role: document.getElementById('inputRole').value,
                status: document.getElementById('inputStatus').value
            };

            try {
                const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === 'success') {
                    showToast(result.message);
                    closeModal();
                    fetchData();
                } else {
                    showToast(result.message, true);
                }
            } catch (err) {
                showToast('Gagal menyimpan data', true);
            }
        }

        async function deleteData(id) {
            if (confirm('Hapus baris ini?')) {
                showLoading(true);
                try {
                    const res = await fetch(APPS_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify({ apiKey: SECRET_API_KEY, action: 'delete', id: id }) 
                    });
                    const result = await res.json();
                    if (result.status === 'success') {
                        showToast(result.message);
                        fetchData();
                    } else {
                        showToast(result.message, true);
                    }
                } catch (err) { showToast('Gagal menghapus data', true); }
                finally { showLoading(false); }
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Tambah Data Baru';
            document.getElementById('editId').value = '';
            document.getElementById('dataForm').reset();
            document.getElementById('dataModal').classList.remove('hidden');
            document.getElementById('dataModal').classList.add('flex');
        }

        function openEditModal(id) {
            const item = sheetData.find(d => String(d.id) === String(id));
            if (!item) return;
            document.getElementById('modalTitle').innerText = 'Edit Data';
            document.getElementById('editId').value = item.id;
            document.getElementById('inputName').value = item.name;
            document.getElementById('inputEmail').value = item.email;
            document.getElementById('inputRole').value = item.role;
            document.getElementById('inputStatus').value = item.status;
            document.getElementById('dataModal').classList.remove('hidden');
            document.getElementById('dataModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('dataModal').classList.add('hidden');
            document.getElementById('dataModal').classList.remove('flex');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
